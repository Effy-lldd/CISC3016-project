<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forex News | 全球外汇新闻</title>
    <!-- 引入独立CSS -->
    <link rel="stylesheet" href="css/news.css">
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 新增：ONNX 推理引擎 + 音频处理 -->
     <script type="importmap">
        {
            "imports": {
            "@edge-tts/universal": "https://cdn.jsdelivr.net/npm/@edge-tts/universal@1.2.3/dist/browser/index.js"
            }
        }
    </script>
</head>
<body>
    <!-- 返回按钮 -->
    <button class="back-btn" id="backBtn">
        <i class="fas fa-arrow-left"></i> Back
    </button>

    <!-- 新闻标题 -->
    <h1 class="news-full-title"></h1>
    <div class="news-source"></div>
    
    <!-- 音频播放 -->
    <!-- <audio class="audio-player" controls>
        <source src="" type="audio/mpeg">
        Your browser does not support audio playback.
    </audio> -->

    <!-- <button id="readAloudBtn" class="read-aloud-btn">🔊 朗读全文</button> -->

    <!-- 新闻配图 -->
    <img src="" alt="News Image" class="news-full-img">
    
    <!-- 新闻全文 -->
    <div class="news-full-content"></div>
    
    <!-- LLM评论区 -->
    <h3 class="comment-title">Expert Market Comments</h3>
    <div class="comment-list"></div>
    
    <!-- 图片放大模态框 -->
    <div class="modal" id="imgModal">
        <span class="close-btn">&times;</span>
        <img class="modal-img" id="modalImg">
    </div>

    <!-- 原有JS + 新增独立渲染模块 -->
    <script src="js/news.js"></script>
    <script type="module" src="js/Module/modile-news.js"></script>
    <script type="module" src="js/API/renovate.js"></script>
</body>
</html>
